services:
  - type: web
    name: evolve-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      # Model-written code must never run on a public host.
      - key: DEMO_MODE
        value: "false"
      # Free Render disks are ephemeral: data resets on restart/redeploy.
      - key: EVOLVE_DATA_DIR
        value: /tmp/evolve/data
      - key: EVOLVE_WORKSPACE_DIR
        value: /tmp/evolve/workspace
